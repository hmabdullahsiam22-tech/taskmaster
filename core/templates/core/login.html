{% extends 'base.html' %}
{% block title %}লগইন - TaskMaster{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4 text-primary"><i class="fa-solid fa-right-to-bracket me-2"></i>লগইন করুন</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">ইউজারনেম</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="form-label">পাসওয়ার্ড</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">লগইন</button>
            </form>
            <p class="mt-3 text-center">নতুন অ্যাকাউন্ট চান? <a href="{% url 'register' %}">সাইন আপ করুন</a></p>
        </div>
    </div>
</div>
{% endblock %}

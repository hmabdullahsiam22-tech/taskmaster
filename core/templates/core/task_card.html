<div class="card mb-3 shadow-sm border-0">
    <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="badge {% if task.priority == 'high' %}bg-danger{% elif task.priority == 'medium' %}bg-warning text-dark{% else %}bg-secondary{% endif %}">
                {{ task.get_priority_display }} Priority
            </span>
            {% if task.due_date %}
                <small class="text-muted"><i class="fa-regular fa-clock me-1"></i>{{ task.due_date }}</small>
            {% endif %}
        </div>
        <h6 class="card-title my-2 fw-bold">
            <a href="{% url 'task_detail' task.id %}" class="text-decoration-none text-dark">{{ task.title }}</a>
        </h6>
        <div class="d-flex justify-content-between align-items-center mt-3">
            <small class="text-primary"><i class="fa-solid fa-user me-1"></i>{{ task.assigned_to.username|default:"Unassigned" }}</small>
            {% if next_status %}
                <a href="{% url 'update_task_status' task.id next_status %}" class="btn btn-sm btn-outline-dark py-0" style="font-size: 11px;">
                    মোভ: {{ next_text }} <i class="fa-solid fa-angles-right"></i>
                </a>
            {% endif %}
        </div>
    </div>
</div>

{% extends 'base.html' %}
{% block title %}রেজিস্ট্রেশন - TaskMaster{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4 text-primary"><i class="fa-solid fa-user-plus me-2"></i>অ্যাকাউন্ট তৈরি করুন</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 fw-bold">রেজিস্টার করুন</button>
            </form>
            <p class="mt-3 text-center">ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="{% url 'login' %}">লগইন করুন</a></p>
        </div>
    </div>
</div>
{% endblock %}
